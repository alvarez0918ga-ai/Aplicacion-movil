<ion-content class="register-content" [fullscreen]="true">
  <div class="register-container">

    <!-- Logo -->
    <div class="logo-recorte">
      <img class="logo" src="assets/img/logo.png" alt="Logo de la aplicación" />
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="crearCuenta()">

      <!-- Nombre completo -->
      <label class="etiqueta">Nombre completo</label>
      <div class="campo-wrap">
        <ion-icon name="person" class="icono"></ion-icon>
        <ion-input
          type="text"
          placeholder="Ingresa tu nombre completo"
          formControlName="nombre"
        ></ion-input>
      </div>
      <small
        class="error"
        *ngIf="registerForm.get('nombre')?.touched && registerForm.get('nombre')?.invalid"
      >
        Ingresa tu nombre completo
      </small>

      <!-- Correo -->
      <label class="etiqueta">Correo electrónico</label>
      <div class="campo-wrap">
        <ion-icon name="mail" class="icono"></ion-icon>
        <ion-input
          type="email"
          placeholder="Ingresa tu correo electrónico"
          formControlName="correo"
        ></ion-input>
        <ion-icon
          *ngIf="registerForm.get('correo')?.valid"
          name="checkmark-circle"
          class="check"
        ></ion-icon>
      </div>
      <small
        class="error"
        *ngIf="registerForm.get('correo')?.touched && registerForm.get('correo')?.invalid"
      >
        Ingresa un correo válido
      </small>

      <!-- Contraseña -->
      <label class="etiqueta">Contraseña</label>
      <div class="campo-wrap campo-pass">
        <ion-icon name="lock-closed" class="icono"></ion-icon>
        <ion-input
          [type]="verPassword ? 'text' : 'password'"
          placeholder="Crea una contraseña"
          formControlName="password"
        ></ion-input>
        <ion-icon
          [name]="verPassword ? 'eye-off' : 'eye'"
          class="ojo"
          (click)="alternarPassword()"
        ></ion-icon>
      </div>
      <p
        class="ayuda"
        [class.ayuda-error]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
      >
        La contraseña debe tener al menos 8 caracteres, incluir una mayúscula,
        una minúscula y un número.
      </p>

      <ion-button expand="block" type="submit" class="btn-principal" color="AzulDD">
        Crear cuenta
      </ion-button>
    </form>

    <!-- Separador -->
    <div class="separador"><span>o regístrate con</span></div>

    <!-- Google -->
    <ion-button
      expand="block"
      type="button"
      class="btn-google"
      (click)="registrarConGoogle()"
    >
      <svg slot="start" class="g-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.7 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
        <path fill="#FBBC05" d="M10.4 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.4 0 20.1 0 24s1 7.6 2.6 10.8l7.8-6.1z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      Continuar con Google
    </ion-button>

    <!-- Ir al login -->
    <p class="login-link">
      ¿Ya tienes una cuenta?
      <a (click)="irAInicioSesion()">Inicia sesión</a>
    </p>

  </div>
</ion-content>
