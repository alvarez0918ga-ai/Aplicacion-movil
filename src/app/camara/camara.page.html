<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Registrar Medicamento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="camara-content">
  <div class="contenedor-principal">

    <form (ngSubmit)="guardarMedicamento()">

      <ion-card class="form-card">
        <ion-card-header>
          <ion-card-title>Información del Medicamento</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ion-list lines="inset">
            <!-- 1. Nombre -->
            <ion-item>
              <ion-input
                type="text"
                name="nombre"
                label="Nombre del medicamento *"
                labelPlacement="stacked"
                [(ngModel)]="medicamento.nombre"
                placeholder="Ej: Paracetamol"
                required
              ></ion-input>
            </ion-item>

      
            <ion-item>
              <ion-input
                type="text"
                name="dosis"
                label="Dosis / Presentación"
                labelPlacement="stacked"
                [(ngModel)]="medicamento.dosis"
                placeholder="Ej: 500 mg · 1 tableta"
              ></ion-input>
            </ion-item>

            <ion-item>
              <ion-input
                type="time"
                name="hora"
                label="Hora de la toma"
                labelPlacement="stacked"
                [(ngModel)]="medicamento.hora"
              ></ion-input>
            </ion-item>

            <ion-item lines="none">
              <ion-textarea
                name="notas"
                label="Recomendaciones (opcional)"
                labelPlacement="stacked"
                [(ngModel)]="medicamento.notas"
                placeholder="Ej: Tomar con un vaso de agua después de los alimentos..."
                [autoGrow]="true"
                rows="3"
              ></ion-textarea>
            </ion-item>
          </ion-list>
        </ion-card-content>
      </ion-card>

      <ion-card class="foto-card">
        <ion-card-header>
          <ion-card-title>Foto del medicamento</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <div class="preview-box" *ngIf="imagenUrl">
            <ion-img [src]="imagenUrl" alt="Foto del medicamento"></ion-img>
            <div class="acciones-foto">
              <ion-button size="small" fill="outline" (click)="escanearMedicamento()">
                <ion-icon slot="start" name="camera-outline"></ion-icon>
                Repetir foto
              </ion-button>
              <ion-button size="small" fill="outline" (click)="subirDesdeGaleria()">
                <ion-icon slot="start" name="image-outline"></ion-icon>
                Cambiar
              </ion-button>
              <ion-button size="small" color="danger" fill="clear" (click)="eliminarFoto()">
                <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
              </ion-button>
            </div>
          </div>

          <div class="foto-placeholder" *ngIf="!imagenUrl">
            <ion-icon name="image-outline" class="icono-placeholder"></ion-icon>
            <p class="foto-texto">Agrega una imagen para identificar tu medicamento</p>
            <ion-row>
              <ion-col size="6">
                <ion-button expand="block" (click)="escanearMedicamento()">
                  <ion-icon slot="start" name="camera-outline"></ion-icon>
                  Tomar foto
                </ion-button>
              </ion-col>
              <ion-col size="6">
                <ion-button expand="block" fill="outline" (click)="subirDesdeGaleria()">
                  <ion-icon slot="start" name="image-outline"></ion-icon>
                  Galería
                </ion-button>
              </ion-col>
            </ion-row>
          </div>
        </ion-card-content>
      </ion-card>

      <ion-button expand="block" type="submit" size="large" color="primary" class="btn-guardar">
        <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
        Guardar medicamento
      </ion-button>
    </form>

  </div>
</ion-content>
