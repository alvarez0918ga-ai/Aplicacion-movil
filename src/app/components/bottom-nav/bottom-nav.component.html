<ion-footer class="ion-no-border footer-nav">
  <nav class="nav">
    <button
      type="button"
      class="nav-item"
      *ngFor="let t of tabs"
      [class.activo]="tabActivo === t.id"
      [class.item-destacado]="t.tipo === 'robot'"
      (click)="irA(t.id)"
    >
      <!-- Icono estándar -->
      <ion-icon *ngIf="t.tipo === 'icono'" [name]="t.icono"></ion-icon>

      <!-- Botón circular destacado con robot (Asistente IA) -->
      <div *ngIf="t.tipo === 'robot'" class="circulo-robot">
        <svg class="icono-robot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="13" rx="3"></rect>
          <path d="M12 7V3"></path>
          <circle cx="12" cy="3" r="1" fill="currentColor"></circle>
          <circle cx="8" cy="12" r="1.5" fill="currentColor"></circle>
          <circle cx="16" cy="12" r="1.5" fill="currentColor"></circle>
          <path d="M9 16h6"></path>
          <path d="M1 12h2"></path>
          <path d="M21 12h2"></path>
        </svg>
      </div>

      <span class="nav-etiqueta">{{ t.etiqueta }}</span>
    </button>
  </nav>

  <div class="home-bar-indicator"></div>
</ion-footer>
